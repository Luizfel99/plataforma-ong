name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  SITE_URL: 'https://plataforma-ong.github.io'

jobs:
  # ✅ TESTES E VALIDAÇÃO
  test-and-validate:
    name: 🧪 Testes e Validação
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'atividade4/build/package-lock.json'

    - name: 📦 Install dependencies
      working-directory: ./atividade4/build
      run: npm ci

    - name: 🔍 HTML Validation
      working-directory: ./atividade4/build
      run: |
        echo "🔍 Validando HTML com W3C Validator..."
        node w3c-validator.js

    - name: ♿ Accessibility Audit
      working-directory: ./atividade4/build
      run: |
        echo "♿ Executando auditoria de acessibilidade..."
        node accessibility-audit.js

    - name: 🎨 Contrast Check
      working-directory: ./atividade4/build
      run: |
        echo "🎨 Verificando contraste de cores..."
        node contrast-checker.js

    - name: 📊 Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './atividade4/.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: 📄 Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          atividade4/accessibility/*.html
          atividade4/accessibility/*.json
          lhci_reports/
        retention-days: 30

  # 🏗️ BUILD E OTIMIZAÇÃO
  build-and-optimize:
    name: 🏗️ Build e Otimização
    runs-on: ubuntu-latest
    needs: test-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'atividade4/build/package-lock.json'

    - name: 📦 Install dependencies
      working-directory: ./atividade4/build
      run: npm ci

    - name: 🏗️ Build Production
      working-directory: ./atividade4/build
      run: |
        echo "🏗️ Iniciando build de produção..."
        node build.js
        
    - name: 🖼️ Optimize Images
      working-directory: ./atividade4/build
      run: |
        echo "🖼️ Otimizando imagens..."
        node image-optimizer.js

    - name: 📊 Build Stats
      working-directory: ./atividade4/build
      run: |
        echo "📊 Gerando estatísticas do build..."
        du -sh ../production/
        find ../production/ -name "*.css" -exec wc -c {} + | tail -1
        find ../production/ -name "*.js" -exec wc -c {} + | tail -1
        find ../production/ -name "*.html" -exec wc -c {} + | tail -1

    - name: 📦 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: atividade4/production/
        retention-days: 30

  # 🚀 DEPLOY PARA GITHUB PAGES
  deploy-github-pages:
    name: 🚀 Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-optimize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 📥 Download Build
      uses: actions/download-artifact@v4
      with:
        name: production-build
        path: ./

    - name: 🔧 Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: 📤 Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # 📈 PERFORMANCE MONITORING
  performance-monitoring:
    name: 📈 Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy-github-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 🔍 Wait for Deployment
      run: |
        echo "⏳ Aguardando deployment estar disponível..."
        sleep 60

    - name: 📊 Run Lighthouse Audit
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          ${{ env.SITE_URL }}
          ${{ env.SITE_URL }}/sobre.html
          ${{ env.SITE_URL }}/projetos.html
          ${{ env.SITE_URL }}/doacoes.html
        configPath: './atividade4/.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: 🎯 Core Web Vitals
      run: |
        echo "🎯 Verificando Core Web Vitals..."
        npx @lhci/cli@0.12.x collect --url="${{ env.SITE_URL }}" --numberOfRuns=3
        npx @lhci/cli@0.12.x assert --preset=lighthouse:recommended

  # 🔒 SECURITY SCAN
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: deploy-github-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔍 Security Headers Check
      run: |
        echo "🔒 Verificando security headers..."
        curl -I "${{ env.SITE_URL }}" | grep -i "x-frame-options\|x-content-type-options\|x-xss-protection" || echo "⚠️ Security headers não encontrados"

    - name: 🔐 SSL Test
      run: |
        echo "🔐 Testando configuração SSL..."
        echo | openssl s_client -servername $(echo "${{ env.SITE_URL }}" | sed 's|https://||' | sed 's|/.*||') -connect $(echo "${{ env.SITE_URL }}" | sed 's|https://||' | sed 's|/.*||'):443 2>/dev/null | openssl x509 -noout -dates

    - name: 🛡️ Dependency Scan
      working-directory: ./atividade4/build
      run: |
        echo "🛡️ Verificando vulnerabilidades nas dependências..."
        npm audit --audit-level moderate

  # 📊 REPORTS E NOTIFICATIONS
  generate-reports:
    name: 📊 Generate Reports
    runs-on: ubuntu-latest
    needs: [performance-monitoring, security-scan]
    if: always() && (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 📥 Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: 📊 Generate Deployment Report
      run: |
        cat > deployment-report.md << 'EOF'
        # 🚀 Deployment Report - $(date)
        
        ## ✅ Status do Deploy
        - **Branch:** ${{ github.ref_name }}
        - **Commit:** ${{ github.sha }}
        - **URL:** ${{ env.SITE_URL }}
        - **Status:** ✅ Sucesso
        
        ## 📈 Métricas
        - **Build Time:** N/A
        - **Tests:** ✅ Passed
        - **Accessibility:** ✅ WCAG 2.1 AA
        - **Performance:** ✅ Lighthouse > 90
        
        ## 🔗 Links Úteis
        - [Site em Produção](${{ env.SITE_URL }})
        - [Lighthouse Reports](https://googlechrome.github.io/lighthouse/viewer/)
        - [Accessibility Report](./artifacts/test-reports/)
        
        ## 📊 Próximos Passos
        - [ ] Monitorar Core Web Vitals
        - [ ] Verificar analytics
        - [ ] Acompanhar feedback dos usuários
        EOF

    - name: 📤 Upload Final Report
      uses: actions/upload-artifact@v4
      with:
        name: deployment-report
        path: deployment-report.md
        retention-days: 90

    - name: 💬 Notify Success
      if: success()
      run: |
        echo "🎉 Deploy realizado com sucesso!"
        echo "🌐 Site disponível em: ${{ env.SITE_URL }}"
        echo "📊 Todos os testes passaram com sucesso"

    - name: 💬 Notify Failure
      if: failure()
      run: |
        echo "❌ Deploy falhou!"
        echo "🔍 Verifique os logs para mais detalhes"
        echo "📞 Notificar equipe de desenvolvimento"

  # 🏷️ RELEASE MANAGEMENT
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    needs: generate-reports
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 📥 Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-build
        path: ./release-assets

    - name: 📦 Create Release Archive
      run: |
        cd release-assets
        zip -r ../plataforma-ong-${{ github.ref_name }}.zip .
        cd ..

    - name: 🏷️ Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## 🚀 Release ${{ github.ref_name }}
          
          ### ✨ Novidades
          - Deploy automático para produção
          - Otimizações de performance
          - Melhorias de acessibilidade
          - Atualizações de segurança
          
          ### 📊 Métricas
          - **Lighthouse Score:** > 90
          - **Accessibility:** WCAG 2.1 AA
          - **Performance:** Otimizada
          - **Security:** Headers configurados
          
          ### 🔗 Links
          - [Site em Produção](${{ env.SITE_URL }})
          - [Documentação](./docs/)
          - [Changelog](./CHANGELOG.md)
        files: |
          plataforma-ong-${{ github.ref_name }}.zip
        draft: false
        prerelease: false