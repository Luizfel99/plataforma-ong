  <main>
    <section>
      <h2>Simulação de Checkout</h2>
      <p>Este é um checkout simulado. Os pagamentos não são processados aqui; é apenas um fluxo de demonstração.</p>

      <form id="checkoutForm" data-allow-submit="true">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" name="valor" min="1" value="50" required>

        <label for="recorrente">Doação recorrente?</label>
        <select id="recorrente" name="recorrente">
          <option value="nao">Não</option>
          <option value="mensal">Mensal</option>
        </select>

  <button type="submit" class="btn btn--primary">Confirmar Doação</button>
      </form>

      <div id="result" style="margin-top:16px"></div>
    </section>
  </main>
